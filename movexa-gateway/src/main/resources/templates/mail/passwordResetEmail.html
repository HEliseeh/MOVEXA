<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="fr">
  <head>
    <title th:text="#{email.reset.title}">Réinitialisation du mot de passe</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #e5eae8; font-family: Arial, Helvetica, sans-serif; color: #15201f">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 20px">
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 24px; font-size: 19px; font-weight: bold">flexclub</p>
          <p style="margin: 0 0 12px; font-size: 15px" th:text="#{email.reset.greeting(${user.firstName != null ? user.firstName : user.login})}">Bonjour,</p>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5" th:text="#{email.reset.text1}">
            Tu as demandé à réinitialiser ton mot de passe.
          </p>
          <p style="margin: 0 0 24px">
            <a
              th:with="url=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})"
              th:href="${url}"
              th:text="#{email.reset.button}"
              style="display: inline-block; padding: 14px 24px; border-radius: 14px; background: #2c7a7b; color: #ffffff; font-size: 15px; font-weight: bold; text-decoration: none"
              >Choisir un nouveau mot de passe</a
            >
          </p>
          <p style="margin: 0 0 24px; font-size: 13px; line-height: 1.5; color: #56635f" th:text="#{email.reset.validity}">
            Ce lien est valable 24 heures.
          </p>
          <p style="margin: 0; font-size: 15px">
            <span th:text="#{email.reset.text2}">À bientôt,</span>
            <br />
            <span th:text="#{email.signature}">L'équipe MOVEXA</span>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
