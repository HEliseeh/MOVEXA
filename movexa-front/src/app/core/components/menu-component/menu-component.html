<!-- ================================================================
     ENTRÉE DE NAVIGATION — récursive
     depth 0 : module (icône) · depth 1 : sous-élément (texte seul)
     ================================================================ -->
@if (!allowed()) {
  <!-- Réservé à un autre profil : visible, grisé, cadenas -->
  <span
    class="nav-item nav-item--locked"
    [class.nav-item--child]="depth() > 0"
    role="link"
    aria-disabled="true"
    [attr.title]="lockReason()"
  >
    <ng-container *ngTemplateOutlet="content" />
    <svg class="nav-lock" [attr.width]="depth() > 0 ? 13 : 14" [attr.height]="depth() > 0 ? 13 : 14" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         role="img" aria-label="Accès bloqué">
      <path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4" />
    </svg>
  </span>
} @else if (hasChildren()) {
  <button
    type="button"
    class="nav-item"
    [class.nav-item--active]="isActive()"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="nav-bar" aria-hidden="true"></span>
    <ng-container *ngTemplateOutlet="content" />
    <svg class="nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path [attr.d]="open() ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6'" />
    </svg>
  </button>

  @if (open()) {
    <div class="nav-children" role="group" [attr.aria-label]="item().label">
      @for (child of item().children; track child.id) {
        <app-menu-component [item]="child" [depth]="depth() + 1" [activeId]="activeId()" />
      }
    </div>
  }
} @else if (item().disabled) {
  <!-- Pas encore disponible -->
  <span
    class="nav-item nav-item--soon"
    [class.nav-item--child]="depth() > 0"
    aria-disabled="true"
    title="Bientôt disponible"
  >
    <ng-container *ngTemplateOutlet="content" />
  </span>
} @else {
  <a
    class="nav-item"
    [class.nav-item--child]="depth() > 0"
    [class.nav-item--active]="isActive()"
    [routerLink]="item().route"
    [attr.aria-current]="isActive() ? 'page' : null"
  >
    @if (depth() === 0) {
      <span class="nav-bar" aria-hidden="true"></span>
    }
    <ng-container *ngTemplateOutlet="content" />
  </a>
}

<ng-template #content>
  @if (depth() === 0 && item().iconPath) {
    <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path [attr.d]="item().iconPath" />
    </svg>
  }
  <span class="nav-label">{{ item().label }}</span>
</ng-template>
