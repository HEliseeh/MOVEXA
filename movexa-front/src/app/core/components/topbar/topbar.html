<header class="topbar">

  <!-- Gauche : bouton menu (mobile) + recherche sans cadre -->
  <div class="topbar-left">
    <button
      type="button"
      class="topbar-icon-btn topbar-menu-btn"
      (click)="menuToggle.emit()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path [attr.d]="menuOpen() ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16'" />
      </svg>
    </button>

    <form class="topbar-search" role="search" (submit)="search($event)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14M21 21l-5-5" />
      </svg>
      <label for="top-q" class="visually-hidden">Rechercher un membre</label>
      <input
        id="top-q"
        type="search"
        placeholder="Rechercher un membre…"
        autocomplete="off"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
    </form>
  </div>

  <!-- Droite : état hors ligne, messages, notifications, avatar -->
  <div class="topbar-right">
    @if (syncLabel(); as label) {
      <span class="topbar-sync" role="status">
        <span class="topbar-sync-dot" aria-hidden="true"></span>{{ label }}
      </span>
    }

    <button type="button" class="topbar-icon-btn topbar-icon-btn--soon" aria-label="Messages (bientôt disponible)"
            aria-disabled="true" title="Bientôt disponible">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18v12H3zM3 7l9 6 9-6" />
      </svg>
    </button>
    <button type="button" class="topbar-icon-btn topbar-icon-btn--soon" aria-label="Notifications (bientôt disponible)"
            aria-disabled="true" title="Bientôt disponible">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" />
      </svg>
    </button>

    @if (user()) {
      <span class="topbar-avatar" [class]="'topbar-avatar topbar-avatar--' + avatarTone()" role="img"
            [attr.aria-label]="userLabel()" [attr.title]="userLabel()">{{ initials() }}</span>
    }
  </div>

</header>
