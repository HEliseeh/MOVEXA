<!-- ================================================================
     CONNECTED LAYOUT
     Menu latéral clair sur toute la hauteur + (barre du haut, contenu)
     ================================================================ -->
<div class="layout">
  <app-sidebar class="layout-sidenav" [class.layout-sidenav--open]="menuOpen()" />

  <div class="layout-main">
    <app-topbar class="layout-topbar" [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()" />
    <app-offline-banner />

    <main class="layout-content">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Notifications (ToastService) -->
<app-toast />
