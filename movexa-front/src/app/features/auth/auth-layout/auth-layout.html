<div class="auth-page">
  <div class="auth-card">

    <!-- ===== Panneau visuel : diaporama + citations ===== -->
    <section class="auth-visual">
      @for (s of slides; track s.image; let i = $index) {
        @if (!brokenImages().has(i)) {
          <img
            class="slide-img"
            [class.active]="slide() === i"
            [src]="s.image"
            [alt]="s.alt"
            [style.object-position]="s.position"
            (error)="onImageError(i)"
          />
        }
      }
      <div class="visual-veil" aria-hidden="true"></div>
      <div class="visual-gradient" aria-hidden="true"></div>

      <div class="brand">
        <span class="brand-mark">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" />
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-name">Flex Club</span>
          <span class="brand-tagline">Salle de sport et bien-être</span>
        </div>
      </div>

      <div class="visual-bottom">
        <div class="quotes" aria-live="polite">
          @for (s of slides; track s.image; let i = $index) {
            <figure class="quote" [class.active]="slide() === i" [attr.aria-hidden]="slide() !== i">
              <svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true">
                <path class="quote-mark"
                      d="M0 26V15C0 6.7 4.6 1.7 13 0l1.6 3.6C9.6 5 7.4 8 7.2 12H13v14H0zm19 0V15c0-8.3 4.6-13.3 13-15l1.6 3.6C28.6 5 26.4 8 26.2 12H32v14H19z" />
              </svg>
              <blockquote>{{ s.quote }}</blockquote>
              <figcaption>{{ s.author }}</figcaption>
            </figure>
          }
        </div>

        <div class="slide-controls">
          <div class="dots" role="group" aria-label="Choisir une image">
            @for (s of slides; track s.image; let i = $index) {
              <button
                type="button"
                class="dot"
                [class.active]="slide() === i"
                [attr.aria-label]="s.label"
                [attr.aria-current]="slide() === i"
                (click)="goToSlide(i)"
              ></button>
            }
          </div>
          <button
            type="button"
            class="pause"
            [attr.aria-label]="paused() ? 'Relancer le diaporama' : 'Mettre le diaporama en pause'"
            (click)="togglePause()"
          >
            @if (paused()) {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z" /></svg>
            } @else {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
            }
          </button>
          <span class="credit">Photos Pexels</span>
        </div>
      </div>
    </section>

    <!-- ===== Formulaire de la page ===== -->
    <section class="auth-form-side">
      <ng-content />
    </section>

  </div>
</div>
