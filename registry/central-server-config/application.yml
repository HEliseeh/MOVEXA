configserver:
  name: FlexClubManagement JHipster Registry
jhipster:
  security:
    authentication:
      jwt:
        # Clé de signature des jetons de connexion, partagée par le gateway et le back1.
        # Elle n'est PAS écrite ici : chaque application la lit dans sa variable d'environnement
        # JWT_BASE64_SECRET (fournie par deploy/.env). Sans elle, les applications refusent de démarrer.
        base64-secret: ${JWT_BASE64_SECRET}
